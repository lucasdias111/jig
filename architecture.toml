# Jig's capabilities and the boundaries between them.
#
# `crates/jig-app/tests/architecture.rs` checks the code against this file:
#
# - `[crates]` lists the Jig crates each crate may depend on.
# - Each `[capability.<name>]` in jig-app owns some of the crate's top-level
#   modules (`modules`, every one of them owned exactly once). Other
#   capabilities reach it only through its `contract`, the module paths whose
#   items they may name (`map` means what `map.rs` itself declares, not
#   `map::view`), and only if they list it in `uses`. `uses` must not loop.
# - A capability with a `crate` of its own lists no modules: its contract is
#   what that crate makes public, which the compiler enforces, and the test
#   only checks that jig-app's capabilities reaching it list it in `uses`.
# - Test code (any module path with a `tests` segment, and anything marked
#   `#[cfg(test)]`) is left out.
#
# Crossings that break these rules today are listed in
# `architecture-baseline.txt`. The test fails on any crossing that isn't
# listed there, and on any listed one that no longer happens, so the list
# only shrinks. To rewrite it after removing (or, deliberately, adding) one:
#
#     JIG_ARCH_BLESS=1 cargo test -p jig-app --test architecture

[crates]
jig-process = []
jig-editor = []
jig-commands = []
jig-ai = ["jig-process"]
jig-git = ["jig-commands", "jig-process"]
jig-map = ["jig-ai", "jig-commands"]
jig-planner = ["jig-ai", "jig-commands"]
jig-updates = ["jig-commands", "jig-process"]
jig-app = [
    "jig-ai",
    "jig-commands",
    "jig-editor",
    "jig-git",
    "jig-map",
    "jig-planner",
    "jig-process",
    "jig-updates",
]

# Settings files and what's remembered between launches.
[capability.settings]
modules = ["settings", "recent", "session"]
contract = ["settings", "recent", "session"]
uses = []

# Small shared pieces with no feature of their own.
[capability.kit]
modules = [
    "field_box",
    "theme",
    "project",
    "editorconfig",
    "diff",
    "lines",
    "indentation",
    "brackets",
]
contract = [
    "field_box",
    "theme",
    "project",
    "editorconfig",
    "diff",
    "lines",
    "indentation",
    "brackets",
]
uses = ["settings"]

# Languages and the tools serving them: language servers, formatters and
# debuggers as data, and installing them.
[capability.toolchain]
modules = ["languages", "lsp", "tools", "formatters", "debuggers", "definitions"]
contract = [
    "languages",
    "lsp",
    "lsp::diagnostics",
    "tools",
    "formatters",
    "debuggers",
    "definitions",
]
uses = ["settings", "kit"]

# Editing help in a buffer: documents, edits, snippets, completions, hover,
# find in the file.
[capability.editor]
modules = ["document", "text_edits", "snippets", "completions", "hover", "find_panel"]
contract = ["document", "text_edits", "snippets", "completions", "hover", "find_panel"]
uses = ["settings", "kit", "toolchain"]

# Go to File and Find in Files.
[capability.search]
modules = ["quick_open", "find_in_files", "project_search"]
contract = ["quick_open", "find_in_files", "project_search"]
uses = ["settings", "kit", "toolchain"]

# The file tree and its icons.
[capability.files]
modules = ["file_tree", "file_icons"]
contract = ["file_tree", "file_icons"]
uses = ["settings", "kit", "toolchain", "search"]

# The git command line, the Git view and the branch picker, in their own crate.
[capability.git]
crate = "jig-git"
uses = []

# Run configurations and their output.
[capability.run]
modules = ["run_configs", "run_output", "run_picker"]
contract = ["run_configs", "run_output", "run_picker"]
uses = ["kit", "toolchain"]

# Debug sessions over the Debug Adapter Protocol.
[capability.debug]
modules = ["dap", "debug_target", "lsp_debug"]
contract = ["dap", "debug_target", "lsp_debug"]
uses = ["kit", "toolchain", "run"]

# The coding agent: agents as data, providers and the shared OpenCode server.
[capability.agent]
modules = ["agent", "agents", "providers"]
contract = ["agent", "agents", "providers"]
uses = ["settings", "kit", "toolchain"]

# The task planner, in its own crate.
[capability.planner]
crate = "jig-planner"
uses = []

# The Map, in its own crate.
[capability.map]
crate = "jig-map"
uses = []

# Checking for and installing updates, in their own crate.
[capability.updates]
crate = "jig-updates"
uses = []

# The Settings and About windows.
[capability.preferences]
modules = ["settings_window", "about_window"]
contract = ["settings_window", "about_window"]
uses = ["settings", "kit", "toolchain", "agent", "updates"]

# The app itself: the window and its workspace, menus and shortcuts, putting
# every other capability together. Nothing else should need it.
[capability.shell]
modules = ["main", "workspace", "menus", "shortcuts"]
contract = ["main", "workspace", "menus", "shortcuts"]
uses = [
    "settings",
    "kit",
    "toolchain",
    "editor",
    "search",
    "files",
    "git",
    "run",
    "debug",
    "agent",
    "planner",
    "map",
    "updates",
    "preferences",
]
