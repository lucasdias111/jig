# Jig's capabilities and the boundaries between them.
#
# `crates/jig-app/tests/architecture.rs` checks the code against this file:
#
# - `[crates]` lists the Jig crates each crate may depend on.
# - Each `[capability.<name>]` in jig-app owns some of the crate's top-level
#   modules (`modules`, every one of them owned exactly once). Other
#   capabilities reach it only through its `contract`, the module paths whose
#   items they may name (`map` means what `map.rs` itself declares, not
#   `map::view`), and only if they list it in `uses`. `uses` must not loop.
# - A capability with a `crate` of its own lists no modules: its contract is
#   what that crate makes public, which the compiler enforces, and the test
#   only checks that jig-app's capabilities reaching it list it in `uses`.
# - Test code (any module path with a `tests` segment, and anything marked
#   `#[cfg(test)]`) is left out.
#
# - `[layers]` says how a capability crate is laid out inside, once its
#   capability says `layered = true` (see below and `docs/layers.md`).
#
# Crossings that break these rules today are listed in
# `architecture-baseline.txt`. The test fails on any crossing that isn't
# listed there, and on any listed one that no longer happens, so the list
# only shrinks. To rewrite it after removing (or, deliberately, adding) one:
#
#     JIG_ARCH_BLESS=1 cargo test -p jig-app --test architecture

# Inside a layered crate, each file belongs to a layer by its folder under
# `src/`: `ui/` (or `ui.rs`), `domain/`, `store/`; every other file at the
# top (`lib.rs` and any small API file beside it) is the facade. A layer
# names another (by `crate::` or `super::` paths) only if it `uses` it,
# never names what it `forbids` (a path's start, e.g. `std::fs` covers
# `std::fs::read` and `use std::{fs, …}`), and the facade stays thin: no
# `impl` of what `forbids_impls` lists, and at most `max_lines` lines.
# Test code is left out, as above. Crates convert one at a time: a
# capability marks its crate `layered = true` once it's done.
[layers.facade]
uses = ["ui", "domain", "store"]
forbids = ["std::fs", "std::process", "std::net", "jig_process", "trash"]
forbids_impls = ["Render", "RenderOnce"]
max_lines = 150

# GPUI views, drawing, events and focus. No file or network IO: that's the
# store's.
[layers.ui]
uses = ["domain", "store"]
forbids = ["std::fs", "std::process", "std::net", "jig_process", "trash"]

# The business logic, plain Rust: tested without a window or a folder.
# What it needs kept is a trait here that the store implements.
[layers.domain]
uses = []
forbids = ["gpui_kit", "std::fs", "std::process", "std::net", "jig_process", "trash"]

# The state and how it's kept: `session.rs` (this window or process, in
# memory), `cache.rs` (derived, rebuilt when stale), `persist.rs` (on disk).
[layers.store]
uses = ["domain"]
forbids = ["gpui_kit"]

[crates]
jig-process = []
jig-editor = []
jig-commands = []
jig-ai = ["jig-process"]
jig-agent = ["jig-ai", "jig-process", "jig-settings", "jig-tools"]
jig-debug = ["jig-debuggers", "jig-lsp", "jig-process", "jig-run", "jig-tools"]
jig-debuggers = ["jig-languages", "jig-process", "jig-tools"]
jig-editing = ["jig-commands", "jig-languages", "jig-lsp", "jig-settings"]
jig-files = ["jig-kit", "jig-languages", "jig-search", "jig-settings"]
jig-formatters = ["jig-kit", "jig-languages", "jig-process", "jig-tools"]
jig-git = ["jig-commands", "jig-process"]
jig-kit = ["jig-commands", "jig-settings"]
jig-languages = ["jig-settings", "jig-tools"]
jig-lsp = ["jig-debuggers", "jig-kit", "jig-languages", "jig-process", "jig-tools"]
jig-map = ["jig-ai", "jig-commands"]
jig-planner = ["jig-ai", "jig-commands"]
jig-preferences = ["jig-agent", "jig-ai", "jig-commands", "jig-debuggers", "jig-formatters", "jig-kit", "jig-languages", "jig-lsp", "jig-settings", "jig-updates"]
jig-run = ["jig-commands", "jig-process", "jig-tools"]
jig-search = ["jig-commands", "jig-editor", "jig-languages", "jig-settings"]
jig-settings = ["jig-ai"]
jig-tools = ["jig-process"]
jig-updates = ["jig-commands", "jig-process"]
jig-app = [
    "jig-agent",
    "jig-ai",
    "jig-commands",
    "jig-debug",
    "jig-debuggers",
    "jig-editing",
    "jig-editor",
    "jig-files",
    "jig-formatters",
    "jig-git",
    "jig-kit",
    "jig-languages",
    "jig-lsp",
    "jig-map",
    "jig-planner",
    "jig-preferences",
    "jig-process",
    "jig-run",
    "jig-search",
    "jig-settings",
    "jig-tools",
    "jig-updates",
]

# The ⌘K input, the agent's conversation, notes and the shared panel
# styling, in its own crate.
[capability.commands]
crate = "jig-commands"
layered = true
uses = []

# `EditorHandle`, the only way the AI layer touches the editor, in its own
# crate.
[capability.editor_handle]
crate = "jig-editor"
layered = true
uses = []

# Starting other programs: without a console window, and not forever, in
# its own crate.
[capability.process]
crate = "jig-process"
layered = true
uses = []

# Settings files and what's remembered between launches, in their own crate.
[capability.settings]
crate = "jig-settings"
layered = true
uses = []

# Small shared pieces with no feature of their own, in its own crate.
[capability.kit]
crate = "jig-kit"
layered = true
uses = ["settings"]

# Where Jig's tools live and installing them: the PATH programs are found
# on, Jig's data and config folders, and running installers, in their own
# crate.
[capability.tools]
crate = "jig-tools"
layered = true
uses = []

# The languages and the language servers serving them, as data, and finding
# a server's program, in its own crate.
[capability.languages]
crate = "jig-languages"
layered = true
uses = ["settings", "tools"]

# Formatters as data, and running one, in its own crate.
[capability.formatters]
crate = "jig-formatters"
layered = true
uses = ["kit", "tools"]

# Debuggers as data: which runs what, and installing them, in its own crate.
[capability.debuggers]
crate = "jig-debuggers"
layered = true
uses = ["languages", "tools"]

# Running language servers, and guessing definitions without one, in its own crate.
[capability.language_servers]
crate = "jig-lsp"
layered = true
uses = ["kit", "languages", "debuggers", "tools"]

# find in the file, in its own crate.
[capability.editor]
crate = "jig-editing"
layered = true
uses = ["settings", "kit", "language_servers", "languages"]

# Go to File and Find in Files, in its own crate.
[capability.search]
crate = "jig-search"
layered = true
uses = ["settings", "kit", "languages"]

# The file tree and its icons, in its own crate.
[capability.files]
crate = "jig-files"
layered = true
uses = ["settings", "kit", "languages", "search"]

# The git command line, the Git view and the branch picker, in their own crate.
[capability.git]
crate = "jig-git"
layered = true
uses = []

# Run configurations and their output, in its own crate.
[capability.run]
crate = "jig-run"
layered = true
uses = ["kit", "tools"]

# Debug sessions over the Debug Adapter Protocol, in its own crate.
[capability.debug]
crate = "jig-debug"
layered = true
uses = [
    "kit",
    "debuggers",
    "language_servers",
    "tools",
    "run",
]

# The AI layer without GPUI: the agents' types and protocol clients, the
# providers' config and keys, the tasks and the Map's tools, in its own crate.
[capability.ai]
crate = "jig-ai"
layered = true
uses = []

# The coding agent: agents as data, providers and the shared OpenCode server, in its own crate.
[capability.agent]
crate = "jig-agent"
layered = true
uses = ["settings", "kit", "tools"]

# The task planner, in its own crate.
[capability.planner]
crate = "jig-planner"
layered = true
uses = []

# The Map, in its own crate.
[capability.map]
crate = "jig-map"
uses = []
layered = true

# Checking for and installing updates, in their own crate.
[capability.updates]
crate = "jig-updates"
layered = true
uses = []

# The Settings and About windows, in its own crate.
[capability.preferences]
crate = "jig-preferences"
layered = true
uses = [
    "settings",
    "kit",
    "languages",
    "formatters",
    "debuggers",
    "language_servers",
    "agent",
    "updates",
]

# The app itself: the window and its workspace, menus and shortcuts, putting
# every other capability together. Nothing else should need it.
[capability.shell]
modules = ["main", "workspace", "menus", "shortcuts"]
contract = ["main", "workspace", "menus", "shortcuts"]
uses = [
    "ai",
    "commands",
    "editor_handle",
    "process",
    "settings",
    "kit",
    "tools",
    "languages",
    "formatters",
    "debuggers",
    "language_servers",
    "editor",
    "search",
    "files",
    "git",
    "run",
    "debug",
    "agent",
    "planner",
    "map",
    "updates",
    "preferences",
]
