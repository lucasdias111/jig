# What `cargo about` accepts when it writes THIRD-PARTY-NOTICES for a release
# (script/third-party-notices.sh). A dependency under any other licence fails
# the build, so a new one is looked at before it ships.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Jig's own crates aren't third parties.
private = { ignore = true }

# GPUI Kit's assets bundle Lucide's icons, under ISC (with Feather's MIT for
# the icons it took from there), in a file Cargo's `license` doesn't name.
[gpui-kit-assets.clarify]
license = "Apache-2.0 AND ISC"

[[gpui-kit-assets.clarify.files]]
path = "LICENSE-LUCIDE"
license = "ISC"
checksum = "b495047bd93a9b06913511076f504daba17d5bbeb3e0650f3bb53a4220329c57"

# Its manifest names a licence file instead of an SPDX id; the file is MIT.
[tree-sitter-graphql.clarify]
license = "MIT"

[[tree-sitter-graphql.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "5ea7d9ec06cb21ca0a800b69cd954e346bafba94620eb115c4b1fead3f3b30f8"
