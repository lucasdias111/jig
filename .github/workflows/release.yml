name: Release

# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) builds
# Jig for macOS, Linux and Windows, signs each build and publishes them as a
# GitHub release, which running copies of Jig then offer as an update.
#
# The tag must match the version in Cargo.toml: Jig compares the two, so a
# mismatch would offer the same update forever.
#
# Signing needs the MINISIGN_KEY secret: the contents of the minisign secret
# key whose public half is `PUBLIC_KEY` in crates/jig-app/src/update/release.rs.
# Jig won't install a build that isn't signed with it.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            asset: Jig-macos-arm64.zip
          # The oldest Ubuntu runner, so the build runs on older glibc too.
          - os: ubuntu-22.04
            asset: Jig-linux-x86_64.tar.gz
          - os: windows-latest
            asset: Jig-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
      - name: Install GPUI's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Writes THIRD-PARTY-NOTICES.txt, the dependencies' licences, which
      # every archive carries beside Jig's own LICENSE.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - name: Build Jig.app
        if: runner.os == 'macOS'
        # ditto keeps the bundle's structure and permissions, which zip can lose.
        run: |
          script/bundle-macos.sh
          ditto -c -k --keepParent target/Jig.app ${{ matrix.asset }}
      - name: Build Jig
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p jig-app
          script/third-party-notices.sh
          mkdir dist
          cp target/release/Jig LICENSE target/THIRD-PARTY-NOTICES.txt dist/
          tar -czf ${{ matrix.asset }} -C dist Jig LICENSE THIRD-PARTY-NOTICES.txt
      - name: Build Jig.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p jig-app
          bash script/third-party-notices.sh
          Compress-Archive -Path target/release/Jig.exe, LICENSE, target/THIRD-PARTY-NOTICES.txt -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Sign the builds
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        # The trusted comment, which the key signs too, names the version and
        # the build, so an older signed build can't pass as this one.
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "The MINISIGN_KEY secret isn't set, so the builds can't be signed." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          version=${GITHUB_REF_NAME#v}
          cd dist
          for asset in *; do
            minisign -S -s "$key" -m "$asset" -t "jig $version $asset" < /dev/null
          done
          rm -f "$key"
          ls -l
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
