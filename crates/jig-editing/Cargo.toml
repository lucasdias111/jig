[package]
name = "jig-editing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets jig-app's tests use what this crate's own tests do, and keeps them
# off the user's own files and tools.
testing = ["jig-lsp/testing", "jig-languages/testing"]

[dependencies]
gpui-kit.workspace = true
jig-commands.workspace = true
jig-lsp.workspace = true
jig-languages.workspace = true
jig-settings.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
lsp-types = "0.97"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
jig-lsp = { workspace = true, features = ["testing"] }
jig-languages = { workspace = true, features = ["testing"] }
tempfile.workspace = true
