[package]
name = "jig-planner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets jig-app's UI tests drive the planner.
testing = []

[dependencies]
gpui-kit.workspace = true
jig-ai.workspace = true
jig-commands.workspace = true
anyhow.workspace = true
regex = "1"
# Deleting a task moves its file to the Trash, so it can be undone.
trash = "5"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
