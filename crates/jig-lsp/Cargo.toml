[package]
name = "jig-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets jig-app's tests use what this crate's own tests do, and keeps them
# off the user's own files and tools.
testing = ["jig-debuggers/testing", "jig-languages/testing", "jig-kit/testing", "jig-tools/testing"]

[dependencies]
gpui-kit.workspace = true
jig-debuggers.workspace = true
jig-languages.workspace = true
jig-kit.workspace = true
jig-tools.workspace = true
jig-process.workspace = true
anyhow.workspace = true
serde_json.workspace = true
regex = "1"
futures = "0.3"
lsp-types = "0.97"
trash = "5"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
jig-debuggers = { workspace = true, features = ["testing"] }
jig-languages = { workspace = true, features = ["testing"] }
jig-kit = { workspace = true, features = ["testing"] }
jig-tools = { workspace = true, features = ["testing"] }
tempfile.workspace = true
toml.workspace = true
