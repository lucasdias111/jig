[package]
name = "jig-debuggers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets jig-app's tests use what this crate's own tests do, and keeps them
# off the user's own files and tools.
testing = ["jig-languages/testing", "jig-tools/testing"]

[dependencies]
jig-languages.workspace = true
jig-tools.workspace = true
jig-process.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
trash = "5"

[dev-dependencies]
jig-languages = { workspace = true, features = ["testing"] }
jig-tools = { workspace = true, features = ["testing"] }
tempfile.workspace = true
