# Cases for `cargo run -p jig-ai --example eval`: real code from Jig, a
# jig to run on it, and what a correct reply does.
#
# id: unique; `--only <text>` runs the cases whose id contains it.
# jig: a jig's name in assets/default-jigs.toml.
# file, lines: the selection, at `rev`, lines counted from 1, both included.
# strip_comments: take the selection's whole-line comments out first, so
#   Add docs has something to do; the author's comments are the reference.
# may_stay: Simplify may rightly return the code as it was.
# must, must_not: the judge's checklist.
# crate, test: what --compile builds and tests after a Simplify.

rev = "72b2b0a"
# A bigger model than the one being graded; `--judge` overrides it.
judge = "opencode-go/deepseek-v4-pro"

# Explain

[[case]]
id = "explain-lcs-table"
jig = "Explain"
file = "crates/jig-app/src/diff.rs"
lines = "34-47"
must = ["Says it fills a longest-common-subsequence table over lines, from the end backwards"]
must_not = ["Says it compares characters rather than lines", "Calls it an edit-distance or Levenshtein table", "Explains the rest of line_diff instead of this table"]

[[case]]
id = "explain-changed-range"
jig = "Explain"
file = "crates/jig-app/src/diff.rs"
lines = "83-104"
must = ["Says it trims the common prefix and suffix of old and new to find the part that differs, returning that range of old and the matching slice of new"]
must_not = ["Says it diffs line by line", "Says it returns several ranges"]

[[case]]
id = "explain-fuzzy-score-path"
jig = "Explain"
file = "crates/jig-app/src/fuzzy.rs"
lines = "64-86"
must = ["Says a match within the file name is tried first and scores far higher, falling back to the whole path"]
must_not = ["Says the query must be a prefix or contiguous substring", "Says longer paths score higher"]

[[case]]
id = "explain-one-line-shortness"
jig = "Explain"
file = "crates/jig-app/src/fuzzy.rs"
lines = "73-73"
must = ["Says this is a penalty that grows with the path's length (a quarter point per character), so shorter paths rank higher"]
must_not = ["Explains the whole function instead of this line", "Says it measures only the file name", "Says longer paths are favoured"]

[[case]]
id = "explain-bracket-matching"
jig = "Explain"
file = "crates/jig-app/src/brackets.rs"
lines = "11-44"
must = ["Says it finds the bracket next to the cursor (just before it, else just after) and the bracket it pairs with, ignoring brackets in strings and comments"]
must_not = ["Says it only looks forward from the cursor", "Says it returns a pair even when the kinds differ, like ( with ]"]

[[case]]
id = "explain-char-literal"
jig = "Explain"
file = "crates/jig-app/src/brackets.rs"
lines = "97-105"
must = ["Says it returns the length of a character literal like '(' or an escaped '\\'' at the start, and None otherwise, e.g. for a lifetime"]
must_not = ["Says it parses string literals", "Says it handles multi-character escapes like '\\u{..}'"]

[[case]]
id = "explain-detect-indentation"
jig = "Explain"
file = "crates/jig-app/src/indentation.rs"
lines = "23-67"
must = ["Says it chooses tabs when more lines start with a tab than with spaces, otherwise the most common change in indentation between consecutive lines as the space count, defaulting to 4 spaces"]
must_not = ["Says it averages the indentation", "Says it uses the smallest indentation found", "Says it counts single-space steps"]

[[case]]
id = "explain-one-line-tie-break"
jig = "Explain"
file = "crates/jig-app/src/indentation.rs"
lines = "57-59"
must = ["Says it picks the most frequent step of 2 or more spaces, and on a tie the smaller step"]
must_not = ["Says ties go to the larger step", "Says it includes a step of one space"]

[[case]]
id = "explain-line-span"
jig = "Explain"
file = "crates/jig-app/src/lines.rs"
lines = "18-27"
must = ["Says it widens the selection to the whole lines it touches, without the final newline, leaving out a line the selection only reaches the start of"]
must_not = ["Says the returned range includes the last line's newline"]

[[case]]
id = "explain-offset-of"
jig = "Explain"
file = "crates/jig-app/src/lines.rs"
lines = "155-179"
must = ["Says it turns a 1-based `line` or `line:column` into a byte offset, clamping past the end to the last line or the line's end"]
must_not = ["Says the numbers are 0-based", "Says it returns None for a line past the end"]

[[case]]
id = "explain-parse-reply"
jig = "Explain"
file = "crates/jig-ai/src/response.rs"
lines = "51-70"
must = ["Says it reads the first JSON object in the model's output, rejects a reply containing the region markers, and makes the trailing newline match the original"]
must_not = ["Says it requires the whole output to be JSON", "Says it strips markdown fences"]

[[case]]
id = "explain-with-retries"
jig = "Explain"
file = "crates/jig-ai/src/http.rs"
lines = "75-93"
must = ["Says it retries the request when the server is busy (429/5xx) or the connection failed, waiting between tries, and otherwise returns the JSON or error"]
must_not = ["Says it retries forever", "Says it retries on every error, such as 400 or 401", "Says it retries after a whole-request timeout"]

[[case]]
id = "explain-apply-diff"
jig = "Explain"
file = "crates/jig-ai/src/agent.rs"
lines = "323-399"
must = ["Says it applies a unified diff's hunks to the text, placing each where its header says or the next place later where its old lines fit, failing if none"]
must_not = ["Says it uses the new-file line numbers to place hunks", "Says it searches backwards or anywhere in the file"]

[[case]]
id = "explain-locate-link"
jig = "Explain"
file = "crates/jig-app/src/planner/links.rs"
lines = "114-144"
must = ["Says it finds where a code link points: the whole-word use of its symbol nearest the link's line (or its declaration without a line), else the start of that line's code"]
must_not = ["Says it uses only the line number", "Says it matches parts of longer names"]

[[case]]
id = "explain-output-within"
jig = "Explain"
file = "crates/jig-process/src/timed.rs"
lines = "16-53"
must = ["Says it runs the command collecting stdout and stderr, and kills it (and its process group) with a TimedOut error if it runs past the limit"]
must_not = ["Says it uses async or a timeout from the OS", "Says partial output is returned on timeout"]

[[case]]
id = "explain-selection-button-position"
jig = "Explain"
file = "crates/jig-app/src/workspace/selection_button.rs"
lines = "39-55"
must = ["Says it works out where the button beside the selection goes, or None when it shouldn't show (setting off, home page, a modal or run open, no selection, editor unfocused, selection off screen)"]
must_not = ["Says it draws or renders the button", "Says it is placed at the mouse position"]

[[case]]
id = "explain-version-parse"
jig = "Explain"
file = "crates/jig-app/src/update/release.rs"
lines = "29-36"
must = ["Says it parses major.minor.patch with an optional leading v, and returns None for anything else, so pre-releases like 0.3.0-beta are refused"]
must_not = ["Says it accepts two-part versions like 1.2", "Says pre-release tags are parsed or ignored and accepted"]

# Simplify

[[case]]
id = "simplify-diff-too-big"
jig = "Simplify"
file = "crates/jig-app/src/diff.rs"
lines = "22-33"
must = ["Keeps the result: for an empty side there is no range or removed text, otherwise the whole of each"]
must_not = ["Adds an empty range or empty string when new or old is empty", "Changes the MAX_LINES condition"]
crate = "jig-app"
test = "diff::"

[[case]]
id = "simplify-match-paths"
jig = "Simplify"
file = "crates/jig-app/src/fuzzy.rs"
lines = "30-56"
must = ["Keeps ties in the order the paths were given (a stable sort)", "Keeps whitespace dropped from the query and characters lowercased"]
must_not = ["Uses sort_unstable or another unstable sort", "Sorts before truncating differently, e.g. truncates first"]
crate = "jig-app"
test = "fuzzy::"

[[case]]
id = "simplify-is-boundary"
jig = "Simplify"
file = "crates/jig-app/src/fuzzy.rs"
lines = "137-144"
must = ["Keeps true at `start`, after / _ - . or a space, and at a lowercase-to-uppercase change"]
must_not = ["Changes which separators count", "Indexes chars[i - 1] when i == start == 0"]
crate = "jig-app"
test = "fuzzy::"

[[case]]
id = "simplify-skip-string"
jig = "Simplify"
file = "crates/jig-app/src/brackets.rs"
lines = "83-95"
must = ["Keeps: a backslash skips the next byte, an unclosed double-quoted string stops at the newline (not past it), backtick strings run across lines, and the end of the input stops it"]
must_not = ["Makes a newline end backtick strings too", "Returns past the newline for an unclosed string"]
crate = "jig-app"
test = "brackets::"

[[case]]
id = "simplify-duplicate-lines"
jig = "Simplify"
file = "crates/jig-app/src/lines.rs"
lines = "71-79"
may_stay = true
must = ["Leaves it as it is or makes a change that is clearly simpler and the same"]
must_not = ["Changes where the copy goes or what ends up selected"]
crate = "jig-app"
test = "lines::"

[[case]]
id = "simplify-select-lines"
jig = "Simplify"
file = "crates/jig-app/src/lines.rs"
lines = "112-122"
must = ["Keeps the rule that an empty selection on a blank line counts as whole, and that the next line is only taken in when there is one"]
must_not = ["Drops the `span.is_empty()` case", "Takes in the next line when the selection isn't already whole lines"]
crate = "jig-app"
test = "lines::"

[[case]]
id = "simplify-splice"
jig = "Simplify"
file = "crates/jig-app/src/text_edits.rs"
lines = "17-30"
must = ["Keeps None for overlapping edits, for no edits, and for a range outside the text or off a character boundary"]
must_not = ["Indexes the text in a way that can panic, e.g. &text[a..b] instead of get", "Returns Some for an empty list of edits"]
crate = "jig-app"
test = "text_edits::"

[[case]]
id = "simplify-applied"
jig = "Simplify"
file = "crates/jig-app/src/text_edits.rs"
lines = "81-88"
may_stay = true
must = ["Keeps the empty-edits case returning the text unchanged (splice returns None for no edits)"]
must_not = ["Removes the empty check so no edits gives None"]
crate = "jig-app"
test = "text_edits::"

[[case]]
id = "simplify-trailing-newline"
jig = "Simplify"
file = "crates/jig-ai/src/response.rs"
lines = "74-87"
must = ["Keeps: an empty original leaves the reply as it is; when the original ends with a newline exactly one is added if missing; when it doesn't, every trailing newline is removed"]
must_not = ["Removes only one trailing newline", "Adds a newline when the original is empty", "Strips other whitespace such as spaces or \\r"]
crate = "jig-ai"
test = "response::"

[[case]]
id = "simplify-tab-size"
jig = "Simplify"
file = "crates/jig-app/src/editorconfig.rs"
lines = "80-103"
must = ["Keeps the precedence: with tabs, tab_width before indent_size; with spaces, indent_size before tab_width; `indent_size = tab` meaning tab_width; zero ignored"]
must_not = ["Swaps the order of tab_width and indent_size for either style", "Lets a size of 0 through"]
crate = "jig-app"
test = "editorconfig::"

[[case]]
id = "simplify-backoff"
jig = "Simplify"
file = "crates/jig-ai/src/http.rs"
lines = "124-132"
may_stay = true
must = ["Keeps: no more tries once attempt reaches RETRIES, the asked wait over the 0.5 s × 3^attempt default, and giving up when the wait is over LONGEST_WAIT"]
must_not = ["Caps the wait at LONGEST_WAIT instead of giving up", "Changes the exponent"]
crate = "jig-ai"
test = "http::"

[[case]]
id = "simplify-error-message"
jig = "Simplify"
file = "crates/jig-ai/src/http.rs"
lines = "240-248"
may_stay = true
must = ["Keeps both shapes: error.message as a string, else error itself as a string"]
must_not = ["Drops the plain-string form of error"]
crate = "jig-ai"
test = "http::"

[[case]]
id = "simplify-line-of"
jig = "Simplify"
file = "crates/jig-app/src/planner/links.rs"
lines = "60-68"
must = ["Keeps: needs a leading L, reads the digits right after it (so L42C5 and L42-L50 give 42), and refuses 0"]
must_not = ["Accepts a fragment without the L", "Fails on L42C5 by parsing the whole rest"]
crate = "jig-app"
test = "planner::links::"

[[case]]
id = "simplify-pick-release"
jig = "Simplify"
file = "crates/jig-app/src/update/release.rs"
lines = "112-140"
must = ["Keeps: drafts and pre-releases skipped, only a version newer than current, and None unless both the asset and its .minisig are there"]
must_not = ["Errors instead of returning None for a missing asset", "Accepts an equal version"]
crate = "jig-app"
test = "update::"

[[case]]
id = "simplify-indexed-rgb"
jig = "Simplify"
file = "crates/jig-app/src/run_output.rs"
lines = "430-439"
may_stay = true
must = ["Keeps the greys for 232-255 (8 + 10 steps) and the 6×6×6 cube with levels 0, 95, 135, 175, 215, 255"]
must_not = ["Changes the arithmetic so any colour comes out different", "Overflows u8, e.g. computing 55 + v * 40 in a way that overflows"]
crate = "jig-app"
test = "run_output::"

[[case]]
id = "simplify-describe-limit"
jig = "Simplify"
file = "crates/jig-process/src/timed.rs"
lines = "55-63"
may_stay = true
must = ["Keeps minutes only for 120 s or more that divide evenly by 60, else seconds"]
must_not = ["Says 1 minutes or 2 minute", "Uses minutes for 90 s"]
crate = "jig-process"
test = "describe"

[[case]]
id = "simplify-relative-path"
jig = "Simplify"
file = "crates/jig-ai/src/agent.rs"
lines = "311-321"
must = ["Keeps: the path inside the directory without leading slashes, the path as it is otherwise, and \".\" for the directory itself"]
must_not = ["Returns an empty string for the directory itself", "Strips a prefix that isn't the directory"]
crate = "jig-ai"
test = "agent::"

# Add docs

[[case]]
id = "docs-changed-range"
jig = "Add docs"
file = "crates/jig-app/src/diff.rs"
lines = "81-104"
strip_comments = true
must = ["A doc comment on the function saying it returns the smallest range of old to replace, and its replacement from new, to turn old into new"]
must_not = ["Docs saying it works line by line", "Changed code"]

[[case]]
id = "docs-score-from"
jig = "Add docs"
file = "crates/jig-app/src/fuzzy.rs"
lines = "88-133"
strip_comments = true
must = ["A doc comment saying it matches the query in chars from `start` as a subsequence, returning its score and matched byte offsets, or None when it doesn't match"]
must_not = ["Docs saying the query must be contiguous", "Docs claiming positions are char indices rather than byte offsets", "Changed code"]

[[case]]
id = "docs-code-brackets"
jig = "Add docs"
file = "crates/jig-app/src/brackets.rs"
lines = "46-71"
strip_comments = true
must = ["A doc comment saying it returns the offsets of brackets from `from` on that are outside strings and comments"]
must_not = ["Docs saying it handles block comments for every language (only with // line comments)", "Changed code"]

[[case]]
id = "docs-active-guide"
jig = "Add docs"
file = "crates/jig-app/src/indentation.rs"
lines = "78-127"
strip_comments = true
must = ["A doc comment saying it returns the rows and column of the indent guide of the block `row` is in, the guide of the block a line opens, and None at top level"]
must_not = ["Docs claiming it returns a single row or the indentation width", "Changed code"]

[[case]]
id = "docs-move-lines"
jig = "Add docs"
file = "crates/jig-app/src/lines.rs"
lines = "38-67"
strip_comments = true
must = ["A doc comment saying it swaps the selected lines with the line above or below, returning None at the top or bottom of the file"]
must_not = ["Docs saying it moves the cursor only", "Changed code"]

[[case]]
id = "docs-delete-lines"
jig = "Add docs"
file = "crates/jig-app/src/lines.rs"
lines = "81-108"
strip_comments = true
must = ["A doc comment saying it removes the lines the selection touches and keeps the cursor at the same column on the line that takes their place"]
must_not = ["Docs saying it deletes only the selected text", "Changed code"]

[[case]]
id = "docs-shift"
jig = "Add docs"
file = "crates/jig-app/src/text_edits.rs"
lines = "32-45"
strip_comments = true
must = ["A doc comment saying it returns where offset ends up after the sorted edits: moved by the edits before it, and kept inside an edit it falls in as far as the new text allows"]
must_not = ["Docs saying edits may be unsorted", "Changed code"]

[[case]]
id = "docs-carry"
jig = "Add docs"
file = "crates/jig-app/src/text_edits.rs"
lines = "47-79"
strip_comments = true
must = ["A doc comment saying that inside an edit the offset keeps to the same code, past as many non-whitespace characters, so a cursor stays on its token when formatting moves whitespace"]
must_not = ["Docs saying it keeps the same column", "Changed code"]

[[case]]
id = "docs-retry-helpers"
jig = "Add docs"
file = "crates/jig-ai/src/http.rs"
lines = "95-122"
strip_comments = true
must = ["Docs on each of busy, transient and retry_after", "busy: statuses meaning try later (rate limit, overload, gateway)", "transient: failures before the request reached the server, not a whole-request timeout", "retry_after: Retry-After in seconds"]
must_not = ["Docs saying retry_after parses HTTP dates", "Docs saying every timeout is transient", "Changed code"]

[[case]]
id = "docs-lenient"
jig = "Add docs"
file = "crates/jig-ai/src/http.rs"
lines = "179-238"
strip_comments = true
must = ["Docs on Lenient saying it drops or renames a field a server rejects by name and retries, and keeps it dropped for the provider's life", "Docs on rejected saying it finds the fallback for a field the error names, only for client errors other than 401/403"]
must_not = ["Docs saying it retries on any error", "Changed code"]

[[case]]
id = "docs-link-target"
jig = "Add docs"
file = "crates/jig-app/src/planner/links.rs"
lines = "26-48"
strip_comments = true
must = ["A doc comment saying it reads a link's URL: web links (with :// or mailto:) open in the browser, others point at a path, an optional line and a symbol named by the link's text or #fragment"]
must_not = ["Docs saying all links are code links", "Changed code"]

[[case]]
id = "docs-glob-translate"
jig = "Add docs"
file = "crates/jig-app/src/editorconfig.rs"
lines = "219-257"
strip_comments = true
must = ["A doc comment saying it turns an editorconfig glob into a regex body: * within a folder, ** across folders, ? one character, classes, braces, escaping"]
must_not = ["Docs saying * matches across folders", "Changed code"]

[[case]]
id = "docs-verify-update"
jig = "Add docs"
file = "crates/jig-app/src/update/release.rs"
lines = "169-191"
strip_comments = true
must = ["Docs saying it checks the archive's minisign signature against Jig's key and that the trusted comment names this release's version and asset, so an older signed build can't pass as newer"]
must_not = ["Docs saying it checks a checksum or hash only", "Changed code"]

[[case]]
id = "docs-apply-sgr"
jig = "Add docs"
file = "crates/jig-app/src/run_output.rs"
lines = "389-428"
strip_comments = true
must = ["A doc comment saying it applies an SGR escape's parameters to the style (bold, dim, italic, underline, colours)"]
must_not = ["Docs saying it sets the background colour (48 is read but not applied)", "Changed code"]

[[case]]
id = "docs-output-within"
jig = "Add docs"
file = "crates/jig-process/src/timed.rs"
lines = "9-53"
strip_comments = true
must = ["Docs saying it runs the command collecting its output like Command::output, but stops it after `limit` with a TimedOut error", "Mentions that the output is read on threads so a full pipe can't block, or that the process group is stopped too"]
must_not = ["Docs saying output so far is returned on timeout", "Changed code"]

[[case]]
id = "docs-bundle-script"
jig = "Add docs"
file = "script/bundle-macos.sh"
lines = "8-27"
strip_comments = true
must = ["Comments in shell syntax (#) explaining the steps: release build, the .app layout, copying the binary, icon and licence, and the third-party notices only when cargo-about is there or on CI"]
must_not = ["Comments saying the notices are always generated", "Changed commands"]
