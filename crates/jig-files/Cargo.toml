[package]
name = "jig-files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets jig-app's tests use what this crate's own tests do, and keeps them
# off the user's own files and tools.
testing = ["jig-search/testing", "jig-languages/testing", "jig-kit/testing"]

[dependencies]
gpui-kit.workspace = true
jig-search.workspace = true
jig-languages.workspace = true
jig-kit.workspace = true
jig-settings.workspace = true
ignore = "0.4"
trash = "5"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
jig-search = { workspace = true, features = ["testing"] }
jig-languages = { workspace = true, features = ["testing"] }
jig-kit = { workspace = true, features = ["testing"] }
tempfile.workspace = true
