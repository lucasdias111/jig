[package]
name = "jig-map"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets jig-app's UI tests drive the Map.
testing = ["dep:tempfile"]

[dependencies]
gpui-kit.workspace = true
jig-ai.workspace = true
jig-commands.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex = "1"
# The fixture projects the `testing` feature offers.
tempfile = { workspace = true, optional = true }
# Export Image: the SVG drawn to a PNG. GPUI already builds this version,
# with these features.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# The index outlines these languages with tree-sitter. `tree-sitter` is GPUI
# Kit's, and the grammars are the versions it already links for highlighting.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
