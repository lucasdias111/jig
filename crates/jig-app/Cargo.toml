[package]
name = "jig-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Capitalised because an unbundled macOS app is named in the menu bar after
# its executable.
[[bin]]
name = "Jig"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
jig-editor.workspace = true
jig-commands.workspace = true
jig-ai.workspace = true
jig-lsp.workspace = true
jig-debuggers.workspace = true
jig-formatters.workspace = true
jig-languages.workspace = true
jig-kit.workspace = true
jig-git.workspace = true
jig-map.workspace = true
jig-planner.workspace = true
jig-settings.workspace = true
jig-tools.workspace = true
jig-updates.workspace = true
jig-process.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
ignore = "0.4"
regex = "1"
libc.workspace = true
futures = "0.3"
# The LSP types GPUI Kit's editor speaks, for go-to-definition.
lsp-types = "0.97"
# Line diffs for previewing the agent's edits (`diff.rs`).
similar = "3"
# Reloading open files changed outside Jig. GPUI already builds this version.
notify = "8"
# Deleting from the file tree moves to the Trash (Recycle Bin), so it can be undone.
trash = "5"
# GDScript's grammar, which GPUI Kit has no feature for; registered in
# `languages::gdscript`. `tree-sitter` is GPUI Kit's, for its `Language`.
tree-sitter-gdscript = "6"
tree-sitter = "0.26"
# More grammars GPUI Kit has no feature for, registered in
# `languages::grammars`. Each must build on `tree-sitter-language` (or
# tree-sitter >= 0.21), so it links against the one tree-sitter above.
tree-sitter-ada = "0.1"
tree-sitter-d = "0.8"
tree-sitter-dart = "0.2"
tree-sitter-dockerfile-updated = "0.2"
tree-sitter-elisp = "1.7"
tree-sitter-elm = "5.9"
tree-sitter-erlang = "0.21"
tree-sitter-fish = "3.6"
tree-sitter-gleam = "1.0"
tree-sitter-glsl = "0.2"
tree-sitter-haskell = "0.24"
tree-sitter-ini = "1.4"
tree-sitter-julia = "0.23"
tree-sitter-less = "1.0"
tree-sitter-matlab = "1.3"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-odin = "1.3"
tree-sitter-pascal = "0.10"
tree-sitter-powershell = "0.26"
tree-sitter-prisma-io = "1.6"
tree-sitter-r = "1.3"
tree-sitter-racket = "0.25"
tree-sitter-scss = "1.0"
tree-sitter-starlark = "1.3"
tree-sitter-vim = "0.4"
tree-sitter-vue-next = "0.1"
tree-sitter-xml = "0.7"

[features]
# Pictures of the Settings window: `JIG_SNAPSHOTS=<folder> cargo run -p jig-app
# --features snapshots` (macOS; needs GPUI's Metal renderer).
snapshots = ["gpui-kit/test-support"]

[dev-dependencies]
jig-lsp = { workspace = true, features = ["testing"] }
jig-debuggers = { workspace = true, features = ["testing"] }
jig-formatters = { workspace = true, features = ["testing"] }
jig-languages = { workspace = true, features = ["testing"] }
jig-kit = { workspace = true, features = ["testing"] }
tempfile.workspace = true
jig-map = { workspace = true, features = ["testing"] }
jig-git = { workspace = true, features = ["testing"] }
jig-planner = { workspace = true, features = ["testing"] }
jig-updates = { workspace = true, features = ["testing"] }
jig-tools = { workspace = true, features = ["testing"] }
# Reads the source as tokens for the architecture test.
proc-macro2 = "1"
gpui-kit = { workspace = true, features = ["test-support"] }
