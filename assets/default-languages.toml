[[server]]
name = "rust-analyzer"
languages = ["rust"]
commands = [["rust-analyzer"]]
root_markers = ["Cargo.toml"]
outermost = true
install = "rustup component add rust-analyzer"
help = "Install it with rustup component add rust-analyzer."

[[server]]
name = "typescript-language-server"
languages = ["typescript", "tsx", "javascript"]
commands = [["typescript-language-server", "--stdio"]]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
install = 'npm install --prefix "${dir}" typescript-language-server typescript'
help = "Needs Node. Install it here, or with npm install -g typescript-language-server typescript."

[[server]]
name = "pyright"
languages = ["python"]
commands = [
    ["basedpyright-langserver", "--stdio"],
    ["pyright-langserver", "--stdio"],
    ["pylsp"],
]
root_markers = [
    "pyproject.toml",
    "pyrightconfig.json",
    "setup.py",
    "setup.cfg",
    "requirements.txt",
]
install = 'npm install --prefix "${dir}" pyright'
help = "Needs Node. Install it here, or with pip install basedpyright."

[[server]]
name = "gopls"
languages = ["go"]
commands = [["gopls"]]
root_markers = ["go.work", "go.mod"]
outermost = true
install = 'GOBIN="${dir}/bin" go install golang.org/x/tools/gopls@latest'
help = "Needs Go. Install it here, or with go install golang.org/x/tools/gopls@latest."

[[server]]
name = "jdtls"
languages = ["java"]
commands = [["jdtls"]]
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle"]
outermost = true
install = """
set -e
tmp=$(mktemp -d)
curl --fail --silent --show-error --location --output "$tmp/jdtls.tar.gz" \
  https://download.eclipse.org/jdtls/milestones/1.61.0/jdt-language-server-1.61.0-202609031315.tar.gz
mkdir -p "${dir}/jdtls" "${dir}/bin"
tar -xzf "$tmp/jdtls.tar.gz" -C "${dir}/jdtls"
rm -rf "$tmp"
ln -sf "${dir}/jdtls/bin/jdtls" "${dir}/bin/jdtls"
"""
help = "Needs a JDK 21 or later. Install it here, or with brew install jdtls."

# Godot's editor serves GDScript over TCP while it's open; `nc` bridges that
# to stdio. Start Godot before opening a script.
[[server]]
name = "godot"
languages = ["gdscript"]
commands = [["nc", "127.0.0.1", "6005"]]
root_markers = ["project.godot"]
help = "Open the project in Godot's editor; it serves GDScript while it's open."

[[server]]
name = "taplo"
languages = ["toml"]
commands = [["taplo", "lsp", "stdio"]]
install = '''
set -e
case "${os}" in
  macos) os=darwin ;;
  linux) os=linux ;;
  *) echo "There's no Taplo for this computer." >&2; exit 1 ;;
esac
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location \
  "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-$os-${arch}.gz" \
  | gunzip > "${dir}/bin/taplo"
chmod +x "${dir}/bin/taplo"
'''
help = "Install it here, or with cargo install --features lsp taplo-cli."

[[server]]
name = "vscode-json-language-server"
languages = ["json"]
commands = [["vscode-json-language-server", "--stdio"]]
install = 'npm install --prefix "${dir}" vscode-langservers-extracted'
help = "Needs Node. Install it here, or with npm install -g vscode-langservers-extracted."

[[server]]
name = "marksman"
languages = ["markdown"]
commands = [["marksman", "server"]]
install = '''
set -e
case "${os}-${arch}" in
  macos-*) asset=marksman-macos ;;
  linux-x86_64) asset=marksman-linux-x64 ;;
  linux-aarch64) asset=marksman-linux-arm64 ;;
  *) echo "There's no marksman for this computer." >&2; exit 1 ;;
esac
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location --output "${dir}/bin/marksman" \
  "https://github.com/artempyanykh/marksman/releases/download/2026-02-08/$asset"
chmod +x "${dir}/bin/marksman"
'''
help = "Install it here, or with brew install marksman."

[[server]]
name = "bash-language-server"
languages = ["bash"]
commands = [["bash-language-server", "start"]]
install = 'npm install --prefix "${dir}" bash-language-server'
help = "Needs Node. Install it here, or with npm install -g bash-language-server."

[[server]]
name = "clangd"
languages = ["c", "cpp"]
commands = [["clangd"]]
root_markers = ["compile_commands.json", "compile_flags.txt", ".clangd"]
install = '''
set -e
case "${os}" in
  macos) asset=clangd-mac-23.1.0.zip ;;
  linux) asset=clangd-linux-23.1.0.zip ;;
  *) echo "There's no clangd for this computer." >&2; exit 1 ;;
esac
curl --fail --silent --show-error --location --output "${dir}/clangd.zip" \
  "https://github.com/clangd/clangd/releases/download/23.1.0/$asset"
unzip -q -o "${dir}/clangd.zip" -d "${dir}"
rm "${dir}/clangd.zip"
mkdir -p "${dir}/bin"
ln -sf ../clangd_23.1.0/bin/clangd "${dir}/bin/clangd"
'''
help = "Install it here; on macOS it also comes with Xcode's command line tools."

