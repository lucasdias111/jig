# The languages Jig knows, and the language servers that serve them.
#
# Each language's grammar is compiled into Jig (a `tree-sitter-*` feature in
# the workspace Cargo.toml, or a module like `languages::gdscript`), so a new
# one needs a new build. Formatters (default-formatters.toml) and debuggers
# (default-debuggers.toml) name the languages they serve themselves.
#
# [[language]]
# name           Jig's name for it: its grammar's, and in settings.toml.
# label          What Settings calls it.
# extensions     The files it takes; where two languages take one, the
#                first in this file wins.
# filenames      Whole file names it takes, for files with no extension to
#                go by, such as Makefile.
# starter        true: in everyone's list from the start. Others are added
#                from Settings > Languages.
# line_comment   What starts a line comment, for Toggle Line Comment.
# lsp_id         The protocol's languageId; defaults to the name.
#
# [[server]]
# name           Its name, also what debuggers call it (`lsp = "jdtls"`).
# languages      The languages it serves, by Jig's names.
# commands       Commands to try in order; the first installed one runs.
#                Jig looks on the PATH, then in the server's own folder in
#                Jig's servers folder (its bin and node_modules/.bin).
# root_markers   Files whose folder is the project root; none, the nearest
#                folder with .git.
# outermost      true: the outermost folder with a marker rather than the
#                nearest, as a Cargo or Go workspace holds its members'.
# install        A shell command Settings' Install button runs. ${dir} is
#                the server's own folder, which Uninstall moves to the Trash;
#                ${os} and ${arch} name this computer (macos, aarch64).
# help           How to get it, for when it isn't installed. A table of
#                { macos, linux, default } when that differs.

[[language]]
name = "rust"
label = "Rust"
extensions = ["rs"]
starter = true
line_comment = "//"

