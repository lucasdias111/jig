# Jig's built-in jigs. Add your own in ~/.config/jig/jigs.toml;
# a jig there with the same name replaces the built-in one.
#
# scope: "selection" (falls back to the current line), "cursor" (insert at
# the cursor) or "file" (the whole file).
# comment: "none" (default), "optional" or "required". Asks for a note that
# is sent along with the prompt, e.g. the entity a controller is for.
# comment_hint: placeholder text for that note.
# agent = true: run on the coding agent (OpenCode), which works across the
# project; you review every edit.
# diagnostics = true: send the problems the language server reports on the
# lines it works on (the selection's, or the cursor's line) with the prompt.
#
# In the ⌘K input, Tab switches between Jig and Agent mode, and a colon
# adds a one-off note: "docs: terse" runs Add docs with the note "terse".

[[jig]]
name = "Add docs"
scope = "selection"
prompt = "Add concise doc comments to this code. Do not change the code itself."

[[jig]]
name = "Extract function"
scope = "selection"
prompt = "Extract this code into a well-named function and replace it with a call to that function. Return both the new function and the call site."

[[jig]]
name = "Simplify"
scope = "selection"
prompt = "Simplify this code without changing its behaviour."

[[jig]]
name = "Fix"
scope = "selection"
prompt = "Fix the problems the language server reports here, or else the bug or compile error in this code. Change as little as possible."
diagnostics = true

[[jig]]
name = "Explain"
scope = "selection"
prompt = "Explain what this code does. Return the code unchanged in `replace`."

[[jig]]
name = "Add tests"
scope = "cursor"
prompt = "Insert a unit test module at the cursor that covers the code in this file."
