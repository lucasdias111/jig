# Jig's built-in formatters, used when a file's language server doesn't
# format (or isn't running). Add your own in ~/.config/jig/formatters.toml;
# one there with the same key replaces the built-in one. A formatter reads
# the file's text on stdin and writes the formatted text to stdout.
#
# key        Its name; the same key in your file replaces this one.
# name       What Jig calls it in messages.
# languages  The languages it formats, by Jig's names.
# command    The program and its arguments. Runs in the file's folder.
#            ${file} is the file's full path, for formatters that pick
#            their settings or parser by it; ${root} the project's folder.
# install    A shell command Settings' Install button runs. ${dir} is the
#            formatter's own folder, which Uninstall moves to the Trash;
#            ${os} and ${arch} name this computer (macos, aarch64).
# help       How to get it, for when it isn't installed. A table of
#            { macos, linux, default } when that differs.
#
# Formatters that aren't installed are skipped; for a language with more
# than one, the one chosen on its Settings page wins, else its language
# server, else the first installed. Programs are looked for on the PATH,
# in the formatter's own folder (its bin and node_modules/.bin) and in the
# project's node_modules/.bin.

[[formatter]]
key = "rustfmt"
name = "rustfmt"
languages = ["rust"]
# rustfmt reads stdin as edition 2015 unless a rustfmt.toml says otherwise.
command = ["rustfmt", "--emit", "stdout", "--edition", "2021"]
install = "rustup component add rustfmt"
help = "Install it with rustup component add rustfmt."

[[formatter]]
key = "prettier"
name = "Prettier"
languages = [
    "typescript", "tsx", "javascript", "json", "markdown", "css", "scss", "less", "html", "vue",
    "yaml", "graphql",
]
command = ["prettier", "--stdin-filepath", "${file}"]
install = 'npm install --prefix "${dir}" prettier'
help = "Needs Node. Install it here, in the project, or with npm install -g prettier."

[[formatter]]
key = "gofmt"
name = "gofmt"
languages = ["go"]
command = ["gofmt"]
help = "It comes with Go, from go.dev/dl."

[[formatter]]
key = "ruff"
name = "Ruff"
languages = ["python"]
command = ["ruff", "format", "--stdin-filename", "${file}", "-"]
install = '''
set -e
case "${os}" in
  macos) triple="${arch}-apple-darwin" ;;
  linux) triple="${arch}-unknown-linux-gnu" ;;
  *) echo "There's no Ruff for this computer." >&2; exit 1 ;;
esac
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location \
  "https://github.com/astral-sh/ruff/releases/download/0.17.0/ruff-$triple.tar.gz" \
  | tar -xz -C "${dir}/bin" --strip-components 1 "ruff-$triple/ruff"
'''
help = "Install it here, or with pip install ruff."

[[formatter]]
key = "black"
name = "Black"
languages = ["python"]
command = ["black", "--quiet", "--stdin-filename", "${file}", "-"]
install = '''
set -e
python3 -m venv "${dir}/venv"
"${dir}/venv/bin/pip" install --quiet --disable-pip-version-check black
mkdir -p "${dir}/bin"
ln -sf ../venv/bin/black "${dir}/bin/black"
'''
help = "Needs Python 3. Install it here, or with pip install black."

[[formatter]]
key = "google-java-format"
name = "google-java-format"
languages = ["java"]
command = ["google-java-format", "-"]
install = '''
set -e
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location --output "${dir}/google-java-format.jar" \
  https://github.com/google/google-java-format/releases/download/v1.37.0/google-java-format-1.37.0-all-deps.jar
printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "${dir}/google-java-format.jar" > "${dir}/bin/google-java-format"
chmod +x "${dir}/bin/google-java-format"
'''
help = "Needs a JDK 21 or later. Install it here, or with brew install google-java-format."

[[formatter]]
key = "taplo"
name = "Taplo"
languages = ["toml"]
command = ["taplo", "format", "-"]
install = '''
set -e
case "${os}" in
  macos) os=darwin ;;
  linux) os=linux ;;
  *) echo "There's no Taplo for this computer." >&2; exit 1 ;;
esac
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location \
  "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-$os-${arch}.gz" \
  | gunzip > "${dir}/bin/taplo"
chmod +x "${dir}/bin/taplo"
'''
help = "Install it here, or with cargo install taplo-cli."

[[formatter]]
key = "clang-format"
name = "clang-format"
languages = ["c", "cpp", "csharp", "proto"]
command = ["clang-format", "--assume-filename", "${file}"]
install = '''
set -e
python3 -m venv "${dir}/venv"
"${dir}/venv/bin/pip" install --quiet --disable-pip-version-check clang-format
mkdir -p "${dir}/bin"
ln -sf ../venv/bin/clang-format "${dir}/bin/clang-format"
'''
help = "Needs Python 3. Install it here, or with your package manager's clang-format."

[[formatter]]
key = "shfmt"
name = "shfmt"
languages = ["bash"]
command = ["shfmt", "--filename", "${file}"]
install = '''
set -e
case "${os}-${arch}" in
  macos-aarch64) asset=darwin_arm64 ;;
  macos-x86_64) asset=darwin_amd64 ;;
  linux-aarch64) asset=linux_arm64 ;;
  linux-x86_64) asset=linux_amd64 ;;
  *) echo "There's no shfmt for this computer." >&2; exit 1 ;;
esac
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location --output "${dir}/bin/shfmt" \
  "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_$asset"
chmod +x "${dir}/bin/shfmt"
'''
help = "Install it here, or with brew install shfmt."

[[formatter]]
key = "stylua"
name = "StyLua"
languages = ["lua"]
command = ["stylua", "--stdin-filepath", "${file}", "-"]
install = '''
set -e
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location --output "${dir}/stylua.zip" \
  "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-${os}-${arch}.zip"
unzip -q -o "${dir}/stylua.zip" -d "${dir}/bin"
rm "${dir}/stylua.zip"
chmod +x "${dir}/bin/stylua"
'''
help = "Install it here, or with cargo install stylua."

[[formatter]]
key = "swift-format"
name = "swift-format"
languages = ["swift"]
command = ["swift", "format", "-"]
help.macos = "It comes with Xcode 16 and later."
help.default = "It comes with the Swift 6 toolchain from swift.org."

[[formatter]]
