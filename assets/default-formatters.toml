command = ["zig", "fmt", "--stdin"]
help = "It comes with Zig, from ziglang.org/download."

[[formatter]]
key = "ktfmt"
name = "ktfmt"
languages = ["kotlin"]
command = ["ktfmt", "--kotlinlang-style", "-"]
install = '''
set -e
mkdir -p "${dir}/bin"
curl --fail --silent --show-error --location --output "${dir}/ktfmt.jar" \
  https://repo1.maven.org/maven2/com/facebook/ktfmt/0.54/ktfmt-0.54-jar-with-dependencies.jar
printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "${dir}/ktfmt.jar" > "${dir}/bin/ktfmt"
chmod +x "${dir}/bin/ktfmt"
'''
help = "Needs a JDK. Install it here, or with brew install ktfmt."

[[formatter]]
key = "mix-format"
name = "mix format"
languages = ["elixir"]
command = ["mix", "format", "--stdin-filename", "${file}", "-"]
help = "It comes with Elixir, from elixir-lang.org/install.html."

[[formatter]]
key = "rubocop"
name = "RuboCop"
languages = ["ruby"]
# Corrected code on stdout, the report on stderr; offenses left aren't a
# failure.
command = [
    "rubocop", "--autocorrect", "--stdin", "${file}", "--stderr", "--format", "quiet",
    "--fail-level", "fatal",
]
help = "Install it with gem install rubocop."

[[formatter]]
key = "sql-formatter"
name = "sql-formatter"
languages = ["sql"]
command = ["sql-formatter"]
install = 'npm install --prefix "${dir}" sql-formatter'
help = "Needs Node. Install it here, or with npm install -g sql-formatter."

[[formatter]]
key = "scalafmt"
name = "scalafmt"
languages = ["scala"]
command = ["scalafmt", "--stdin", "--assume-filename", "${file}"]
install = 'cs install --install-dir "${dir}/bin" scalafmt'
help = "Needs Coursier (cs). Install it here, or with cs install scalafmt."

[[formatter]]
