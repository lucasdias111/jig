"${dir}/venv/bin/pip" install --quiet --disable-pip-version-check 'gdtoolkit==4.*'
mkdir -p "${dir}/bin"
ln -sf ../venv/bin/gdformat "${dir}/bin/gdformat"
'''
help = "Needs Python 3. Install it here, or with pip install 'gdtoolkit==4.*'."

