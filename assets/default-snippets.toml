[[snippets]]
name = "let"
postfix = true
description = "let name = expr;"
languages = ["typescript", "tsx", "javascript"]
body = "let ${1:$NAME} = $EXPR;$0"

[[snippets]]
name = "for"
postfix = true
description = "for (const item of expr)"
languages = ["typescript", "tsx", "javascript"]
body = "for (const ${1:item} of $EXPR) {\n\t$0\n}"

[[snippets]]
name = "foreach"
postfix = true
description = "expr.forEach((item) => …)"
languages = ["typescript", "tsx", "javascript"]
body = "$EXPR.forEach((${1:item}) => {\n\t$0\n});"

[[snippets]]
name = "if"
postfix = true
description = "if (expr)"
languages = ["typescript", "tsx", "javascript"]
body = "if ($EXPR) {\n\t$0\n}"

[[snippets]]
name = "not"
