# Jig's built-in snippets. Your own go in ~/.config/jig/snippets.toml, in
# the same form; one with the same name (and postfix or not) replaces a
# built-in for the languages it lists.
#
# Bodies use the LSP snippet syntax: $1, $2… are the places Tab visits, with
# ${1:default} text, and $0 is where the cursor ends. A tab is one level of
# the file's indentation. Postfix snippets go after an expression and a dot
# (`users.var`); in them $EXPR is the expression and $NAME a name for it.

# Rust

[[snippets]]
name = "for"
description = "for item in items"
languages = ["rust"]
body = "for ${1:item} in ${2:items} {\n\t$0\n}"

[[snippets]]
name = "fori"
description = "for i in 0..n"
languages = ["rust"]
body = "for ${1:i} in 0..${2:n} {\n\t$0\n}"

[[snippets]]
name = "if"
description = "if condition"
languages = ["rust"]
body = "if ${1:condition} {\n\t$0\n}"

[[snippets]]
name = "match"
description = "match value"
languages = ["rust"]
body = "match ${1:value} {\n\t${2:_} => $0,\n}"

[[snippets]]
name = "fn"
description = "fn name()"
languages = ["rust"]
body = "fn ${1:name}($2) {\n\t$0\n}"

[[snippets]]
name = "test"
description = "#[test] fn"
languages = ["rust"]
body = "#[test]\nfn ${1:name}() {\n\t$0\n}"

[[snippets]]
name = "var"
postfix = true
description = "let name = expr;"
languages = ["rust"]
body = "let ${1:$NAME} = $EXPR;$0"

[[snippets]]
name = "for"
postfix = true
description = "for item in expr"
languages = ["rust"]
body = "for ${1:item} in $EXPR {\n\t$0\n}"

[[snippets]]
name = "if"
postfix = true
description = "if expr"
languages = ["rust"]
body = "if $EXPR {\n\t$0\n}"

[[snippets]]
name = "not"
postfix = true
description = "!expr"
languages = ["rust"]
body = "!$EXPR"

[[snippets]]
name = "match"
postfix = true
description = "match expr"
languages = ["rust"]
body = "match $EXPR {\n\t${1:_} => $0,\n}"

[[snippets]]
name = "return"
postfix = true
description = "return expr;"
languages = ["rust"]
body = "return $EXPR;"

[[snippets]]
name = "print"
postfix = true
description = "println!(\"{:?}\", expr);"
languages = ["rust"]
body = "println!(\"{:?}\", $EXPR);"

