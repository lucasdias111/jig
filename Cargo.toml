[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# The only GPUI dependency. Pinned exactly: GPUI distributions cannot be mixed.
# Each grammar is a feature; JSON comes with any of them. Keep in step with
# `jig-app`'s `languages::BUNDLED`.
gpui-kit = { version = "=0.7.0", features = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-java",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
] }
jig-editor = { path = "crates/jig-editor" }
jig-commands = { path = "crates/jig-commands" }
jig-ai = { path = "crates/jig-ai" }
anyhow = "1"

# A patched copy of gpui-base 0.7.0; every change is marked "Jig patch".
# - GPUI Kit's editor stops seeing the mouse once it has scrolled more than a
#   screen, which breaks Cmd+click below the first page (input/base/state.rs).
# - Gutter dots on range decorations, in a column of their own, and a gutter
#   click handler that can be turned off again, for breakpoints
#   (input/editor/decorations.rs, input/base/element.rs, kind.rs).
# - Change bars at the gutter's edge, with clicks, for git
#   (`set_line_changes`, `on_line_change_click`; the same files).
# - Diagnostics move with edits instead of being cleared, can be set from
#   byte ranges, and Jig draws the hovered one in its own panel
#   (input/editor/diagnostics.rs, input/editor/mod.rs, input/base/state.rs).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
