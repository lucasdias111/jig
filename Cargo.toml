[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
# The toolchain rust-toolchain.toml pins, the only one CI builds with.
rust-version = "1.98"

# Every crate takes these with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Each `unsafe` is a syscall or an environment change in a test, with a
# `SAFETY:` comment saying why it's sound.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# The only GPUI dependency. Pinned exactly: GPUI distributions cannot be mixed.
# Each grammar is a feature; JSON comes with any of them. Keep in step with
# `jig-app`'s `languages::BUNDLED`.
gpui-kit = { version = "=0.7.0", features = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-java",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-elixir",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-ruby",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-yaml",
    "tree-sitter-zig",
    "tree-sitter-make",
    "tree-sitter-erb",
    "tree-sitter-ejs",
] }
jig-editor = { path = "crates/jig-editor" }
jig-commands = { path = "crates/jig-commands" }
jig-ai = { path = "crates/jig-ai" }
jig-process = { path = "crates/jig-process" }
# Shared by more than one crate, so they stay on one version.
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"
ureq = "3"

# A patched copy of gpui-base 0.7.0; every change is marked "Jig patch".
# - GPUI Kit's editor stops seeing the mouse once it has scrolled more than a
#   screen, which breaks Cmd+click below the first page (input/base/state.rs).
# - Gutter dots on range decorations, in a column of their own, and a gutter
#   click handler that can be turned off again, for breakpoints
#   (input/editor/decorations.rs, input/base/element.rs, kind.rs).
# - Change bars at the gutter's edge, with clicks, for git
#   (`set_line_changes`, `on_line_change_click`; the same files).
# - Diagnostics move with edits instead of being cleared, can be set from
#   byte ranges, and Jig draws the hovered one in its own panel
#   (input/editor/diagnostics.rs, input/editor/mod.rs, input/base/state.rs).
# - Jig draws the hover itself, after a delay it sets, and hears what is
#   typed, which also puts the hover away (input/editor/lsp/mod.rs, hover.rs,
#   overlay.rs, input/editor/mod.rs).
# - The indent guide of the block the cursor is in, drawn stronger
#   (`set_active_indent_guide`; input/editor/indent.rs, decorations.rs,
#   base/kind.rs, base/element.rs).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
# SCSS's grammar passes GCC's -Wno-unused-parameter to every compiler, which
# MSVC refuses, so Windows couldn't build. Here it's passed only where it's
# taken (bindings/rust/build.rs).
tree-sitter-scss = { path = "vendor/tree-sitter-scss" }
